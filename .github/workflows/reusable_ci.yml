name: Reusable CI/CD Workflow

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.x'
      docker-image-name:
        required: false
        type: string
        default: 'pipo-app' # Default for the calling repo
      docker-registry:
        required: false
        type: string
        default: 'docker.io' # Default to Docker Hub
      run-tests:
        required: false
        type: boolean
        default: true
      build-docker-image:
        required: false
        type: boolean
        default: true
      push-docker-image:
        required: false
        type: boolean
        default: false # Default to false for security

    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pipo (if not already installed)
      run: |
        python -m pip install --upgrade pip
        # Install pipo in editable mode if it's the current repo, otherwise install from PyPI
        if [ -f pyproject.toml ] && grep -q "name = \"pipo\"" pyproject.toml; then
          pip install -e .
        else
          pip install pipo # Assuming pipo is published
        fi
        pip install pytest # pytest is needed for pipo test command

    - name: Install project dependencies
      if: "${{ github.event.inputs.run-tests == 'true' || github.event.inputs.build-docker-image == 'true' }}"
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Run tests
      if: "${{ inputs.run-tests == 'true' }}"
      run: pipo test .

    - name: Build Docker image
      if: "${{ inputs.build-docker-image == 'true' }}"
      run: |
        pipo dockerize .
        docker build -t ${{ inputs.docker-image-name }}:latest .

    - name: Log in to Docker Registry
      if: "${{ inputs.push-docker-image == 'true' && secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}"
      uses: docker/login-action@v2
      with:
        registry: ${{ inputs.docker-registry }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      if: "${{ inputs.push-docker-image == 'true' && secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}"
      run: docker push ${{ inputs.docker-image-name }}:latest

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:

  call-reusable-workflow:

    uses: ./.github/workflows/reusable_ci.yml@master # Atau @main, atau tag/commit SHA spesifik

    with:

      python-version: '3.10' # Contoh: tentukan versi

      docker-image-name: 'ddt-mmt/pipo' # Username Docker Hub Anda/nama repo

      push-docker-image: true

    secrets:

      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}


